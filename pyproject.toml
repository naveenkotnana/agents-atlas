[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-enterprise"
version = "1.0.0"
description = "Atlas — Enterprise AI Knowledge & Decision Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
