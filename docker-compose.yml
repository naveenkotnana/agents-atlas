services:
  # ------------------------------------------------------------
  # 1. PostgreSQL 16 with pgvector extension
  # ------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: atlas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas_user
      POSTGRES_PASSWORD: atlas_secure_password
      POSTGRES_DB: atlas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas_user -d atlas_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - atlas_net

  # ------------------------------------------------------------
  # 2. Ollama Local LLM & Embedding Server
  # ------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: atlas_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    networks:
      - atlas_net

  # ------------------------------------------------------------
  # 3. Atlas FastAPI Application & Decision Engine
  # ------------------------------------------------------------
  atlas-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Atlas Enterprise Decision Intelligence
      - APP_ENV=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://atlas_user:atlas_secure_password@postgres:5432/atlas_db
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_LLM_MODEL=llama3.2
      - OLLAMA_EMBED_MODEL=nomic-embed-text
    volumes:
      - ./data:/app/data
    networks:
      - atlas_net

volumes:
  postgres_data:
    name: atlas_postgres_data
  ollama_models:
    name: atlas_ollama_models

networks:
  atlas_net:
    name: atlas_network
    driver: bridge
